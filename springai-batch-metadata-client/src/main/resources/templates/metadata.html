<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Batch Metadata Assistant</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f3f6fb;
        }
        body {
            margin: 0;
            padding: 3rem 1rem;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem;
            border: 1px solid #dce3ee;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 12px 36px rgb(23 32 51 / 8%);
        }
        h1 { margin-top: 0; }
        p { line-height: 1.55; }
        label { display: block; margin: 1.5rem 0 0.5rem; font-weight: 650; }
        textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 120px;
            padding: 0.85rem;
            border: 1px solid #b9c5d6;
            border-radius: 8px;
            font: inherit;
            resize: vertical;
        }
        button {
            margin-top: 0.85rem;
            padding: 0.7rem 1.1rem;
            border: 0;
            border-radius: 8px;
            background: #175cd3;
            color: #fff;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }
        button:hover { background: #1249a8; }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            background: #f3f6fb;
        }
        .answer-content {
            line-height: 1.6;
            overflow-wrap: anywhere;
        }
        .answer-content > :first-child { margin-top: 0; }
        .answer-content > :last-child { margin-bottom: 0; }
        .answer-content table {
            display: block;
            width: max-content;
            max-width: 100%;
            overflow-x: auto;
            border-collapse: collapse;
        }
        .answer-content th, .answer-content td {
            padding: 0.5rem 0.7rem;
            border: 1px solid #cbd5e1;
            text-align: left;
        }
        .answer-content th { background: #e8edf5; }
        .answer-content pre {
            overflow-x: auto;
            padding: 0.85rem;
            border-radius: 6px;
            background: #e8edf5;
        }
        .answer-content code {
            padding: 0.1rem 0.25rem;
            border-radius: 4px;
            background: #e8edf5;
        }
        .answer-content pre code { padding: 0; background: transparent; }
        .answer-content blockquote {
            margin-left: 0;
            padding-left: 1rem;
            border-left: 3px solid #9aabc2;
            color: #536179;
        }
        .error { color: #b42318; }
        .hint { color: #536179; font-size: 0.95rem; }
    </style>
</head>
<body>
<main>
    <h1>Spring Batch Metadata Assistant</h1>
    <p>Ask about processed files, job status, or record counts. Answers come from Spring Batch
        execution metadata; the assistant cannot see original input-file contents.</p>

    <form method="post" action="/ask">
        <label for="question">Your question</label>
        <textarea id="question" name="question" maxlength="2000" required
                  placeholder="How many files completed today, and how many records were read?"
                  th:text="${question}"></textarea>
        <div class="hint">For example: “Which files failed yesterday?”</div>
        <button type="submit">Ask</button>
    </form>

    <section class="result" th:if="${answerHtml}" aria-live="polite">
        <h2>Answer</h2>
        <div class="answer-content" th:utext="${answerHtml}"></div>
    </section>
    <p class="error" th:if="${error}" th:text="${error}" role="alert"></p>
</main>
</body>
</html>
